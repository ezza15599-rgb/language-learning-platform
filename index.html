<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LANGORA | تعلم اللغات</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
background:#101c3a;
color:white;
text-align:center;
}
header{
padding:25px;
font-size:28px;
font-weight:bold;
color:#e2bd61;
}
main{padding:55px 20px}
h1{font-size:36px}
p{color:#cbd5e1;line-height:1.9}
button{

color:white;
border:0;
padding:15px 30px;
border-radius:12px;
font-size:17px;
margin-top:20px;
}
.card{
background:#1c2c50;
padding:25px;
border-radius:18px;

}

<body>
<header>LANGORA 🌍</header>
<main>
<h1>تعلم لغة جديدة وافتح عالمًا جديدًا</h1>
<p>منصتك لتعلم لغات العالم من الصفر حتى الاحتراف.</p>
<div class="card">
<h2>ابدأ رحلتك الآن</h2>
<p>اكتشف اللغات وطور مهاراتك كل يوم.</p>
<button>ابدأ التعلم</button>
</div>
</main>

</html>
