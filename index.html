
<style>
/* ALMONTAZEM Globe */
.language-universe {
  text-align: center;
  padding: 35px 15px;
  color: white;
  background: #071329;
  border-radius: 22px;
  margin: 25px auto;
  max-width: 850px;
}
.language-globe {
  width: 245px;
  height: 245px;
  margin: 15px auto 30px;
  border-radius: 50%;
  position: relative;
  overflow: hidden;
  display: grid;
  place-items: center;
  background:
    radial-gradient(circle at 30% 25%, #75d9ff, #2478b8 35%, #102e68 72%, #061329);
  box-shadow: 0 0 25px #28a9ff88, inset -18px -12px 35px #02091c;
  animation: globeFloat 4s ease-in-out infinite;
}
.language-globe::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background:
    repeating-linear-gradient(90deg, transparent 0 38px, #a7eaff55 39px 40px),
    repeating-linear-gradient(0deg, transparent 0 38px, #a7eaff44 39px 40px);
  transform: scaleX(.65);
  animation: globeSpin 12s linear infinite;
}
.language-globe::after {
  content: "";
  position: absolute;
  width: 75%;
  height: 100%;
  border: 2px solid #a9eaff66;
  border-radius: 50%;
}
.globe-names {
  position: relative;
  z-index: 2;
  display: grid;
  grid-template-columns: repeat(3, auto);
  gap: 9px 5px;
  padding: 12px;
  direction: ltr;
}
.globe-names span {
  font-size: 10px;
  font-weight: bold;
  color: white;
  background: #061b3dcc;
  border: 1px solid #9ce5ff88;
  border-radius: 12px;
  padding: 4px 6px;
  white-space: nowrap;
}
@keyframes globeFloat {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-9px); }
}
@keyframes globeSpin {
  to { background-position: 80px 0, 0 80px; }
}
.al-level-page {
  display: none;
  padding: 25px 15px;
  text-align: center;
  color: white;
  background: #0b1933;
  border-radius: 18px;
  margin: 20px auto;
  max-width: 850px;
}
.al-language-buttons, .al-level-buttons {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(125px,1fr));
  gap: 12px;
  margin-top: 22px;
}
.al-language-buttons button, .al-level-buttons button,
.al-back-button {
  padding: 14px 10px;
  border: 1px solid #d5ae55;
  border-radius: 12px;
  color: white;
  background: #142b50;
  font-size: 15px;
  cursor: pointer;
}
.al-language-buttons button:hover,
.al-level-buttons button:hover,
.al-back-button:hover {
  background: #a77c2c;
}
.al-level-buttons button strong {
  display: block;
  font-size: 20px;
  color: #f2c76b;
}
#al-selected-language {
  color: #f2c76b;
  font-weight: bold;
}
#al-choice-result {
  margin-top: 20px;
  color: #f2c76b;
  font-size: 17px;
}
</style>

<section class="language-universe" id="al-universe">
  <h2>🌍 ALMONTAZEM</h2>
  <p>One World. Many Languages.</p>

  <div class="language-globe">
    <div class="globe-names">
      <span>العربية</span>
      <span>ENGLISH</span>
      <span>ESPAÑOL</span>
      <span>FRANÇAIS</span>
      <span>DEUTSCH</span>
      <span>中文</span>
      <span>ITALIANO</span>
      <span>РУССКИЙ</span>
      <span>日本語</span>
      <span>TÜRKÇE</span>
      <span>PORTUGUÊS</span>
      <span>हिन्दी</span>
      <span>한국어</span>
    </div>
  </div>

  <h3>Choose Your Language</h3>
  <p>Select the language you want to learn</p>

  <div class="al-language-buttons">
    <button onclick="alChooseLanguage('English')">🇬🇧 English</button>
    <button onclick="alChooseLanguage('Spanish')">🇪🇸 Spanish</button>
    <button onclick="alChooseLanguage('French')">🇫🇷 French</button>
    <button onclick="alChooseLanguage('German')">🇩🇪 German</button>
    <button onclick="alChooseLanguage('Italian')">🇮🇹 Italian</button>
    <button onclick="alChooseLanguage('Arabic')">🇪🇬 Arabic</button>
    <button onclick="alChooseLanguage('Chinese')">🇨🇳 Chinese</button>
    <button onclick="alChooseLanguage('Japanese')">🇯🇵 Japanese</button>
    <button onclick="alChooseLanguage('Turkish')">🇹🇷 Turkish</button>
    <button onclick="alChooseLanguage('Russian')">🇷🇺 Russian</button>
  </div>
</section>

<section class="al-level-page" id="al-level-page">
  <h2>Choose Your Level</h2>
  <p>Your learning language: <span id="al-selected-language"></span></p>
  <p>Select your current level to continue</p>

  <div class="al-level-buttons">
    <button onclick="alChooseLevel('A1','Beginner')">
      <strong>A1</strong>Beginner
    </button>
    <button onclick="alChooseLevel('A2','Elementary')">
      <strong>A2</strong>Elementary
    </button>
    <button onclick="alChooseLevel('B1','Intermediate')">
      <strong>B1</strong>Intermediate
    </button>
    <button onclick="alChooseLevel('B2','Upper Intermediate')">
      <strong>B2</strong>Upper Intermediate
    </button>
    <button onclick="alChooseLevel('C1','Advanced')">
      <strong>C1</strong>Advanced
    </button>
    <button onclick="alChooseLevel('C2','Proficiency')">
      <strong>C2</strong>Proficiency
    </button>
  </div>

  <div id="al-choice-result"></div>
  <br>
  <button class="al-back-button" onclick="alGoBack()">← Back to Languages</button>
</section>

<script>
let alLearningLanguage = "";

function alChooseLanguage(language) {
  alLearningLanguage = language;
  document.getElementById("al-selected-language").textContent = language;
  document.getElementById("al-universe").style.display = "none";
  document.getElementById("al-level-page").style.display = "block";
  document.getElementById("al-choice-result").textContent = "";
  document.getElementById("al-level-page").scrollIntoView({behavior:"smooth"});
}

function alChooseLevel(level, name) {
  document.getElementById("al-choice-result").textContent =
    "Your language: " + alLearningLanguage +
    " | Your level: " + level + " - " + name;
}

function alGoBack() {
  document.getElementById("al-level-page").style.display = "none";
  document.getElementById("al-universe").style.display = "block";
  document.getElementById("al-universe").scrollIntoView({behavior:"smooth"});
}
</script>
